name: Exact scientific checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-finite-campaign:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      README_ENTRY: README.md
      MIN_EXPECTED_PYTHON_SOURCES: '8'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run material gates, exact verifier, and scientific-output comparison
        shell: bash
        run: |
          raw="$RUNNER_TEMP/p107-scientific"
          mkdir -p "$raw"
          export P107_RAW="$raw"
          timeout --signal=TERM --kill-after=10s 480s bash -euo pipefail -c '
            ulimit -t 450
            ulimit -v 2097152
            ulimit -f 131072
            python -B .github/scripts/check_repository.py 2>&1 | tee "$P107_RAW/material-integrity.log"
            python -B verify.py --output "$P107_RAW/generated" 2>&1 | tee "$P107_RAW/verifier.log"
            python -B compare_results.py results "$P107_RAW/generated" 2>&1 | tee "$P107_RAW/comparison.log"
          '
      - name: Retain raw output even after a failed gate or interrupted campaign
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p107-exact-raw-output
          path: ${{ runner.temp }}/p107-scientific/
          if-no-files-found: warn
          retention-days: 14
